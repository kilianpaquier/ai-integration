# yaml-language-server: $schema=https://microsoft.github.io/apm/specs/schemas/manifest-v0.1.schema.json

name: one-for-all
version: 0.1.0

author: Kilian PAQUIER
description: An humble marketplace for AI plugins
license: MIT

# targets: [claude, codex, copilot, cursor, gemini, kiro, opencode, windsurf]

marketplace:
  outputs:
    claude: {}
    codex: {}

  owner:
    name: Kilian PAQUIER
    url: https://kilianpaquier.dev

  packages:
    - category: hybrid
      name: caveman
      source: ./plugins/caveman

    - category: hybrid
      name: codebase-memory-mcp
      source: ./plugins/codebase-memory-mcp

    - category: hybrid
      name: codegraph
      source: ./plugins/codegraph

    - category: hybrid
      name: context7
      source: ./plugins/context7

    - category: skills
      name: exam-drill
      source: ./plugins/exam-drill

    - category: hybrid
      name: feature-dev
      source: ./plugins/feature-dev

    - category: hooks
      name: protected-paths
      source: ./plugins/protected-paths

    - category: skills
      name: schema-converter
      source: ./plugins/schema-converter
