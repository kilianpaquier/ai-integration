title: AI Integration
baseURL: /

defaultContentLanguage: en

theme: github.com/imfing/hextra

languages:
  en:
    label: English
    weight: 1
  fr:
    label: Français
    weight: 2

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Search
      params:
        type: search
      weight: 1
    - name: Language Switcher
      params:
        type: language-switch
      weight: 2
    - name: GitHub
      params:
        icon: github
      url: https://github.com/kilianpaquier/ai-integration
      weight: 3
    - name: GitLab
      params:
        icon: gitlab
      url: https://gitlab.com/kilianpaquier/ai-integration
      weight: 3

params:
  # banner:
  #   key: unique-key # handle closed previous notifications by users
  #   message: |
  #     Some news with emotes handled (or not)
  dateFormat: "January 2, 2006"
  displayUpdatedAuthor: true
  displayUpdatedDate: true
  editURL:
    base: https://gitlab.com/kilianpaquier/ai-integration/-/edit/main/docs/content
    enable: true
  externalLinkDecoration: true
  footer:
    displayCopyright: true
    displayPoweredBy: true
  imageZoom:
    enable: true
  navbar:
    displayLogo: true
    displayTitle: true
    logo:
      dark: logo/10-rounded.webp
      height: 30
      path: logo/10-rounded.webp
      width: 30
  page:
    contextMenu:
      enable: true
    displayPagination: false
  search:
    enable: true
    type: flexsearch
  theme:
    default: system
    displayToggle: true

outputs:
  home: [html, llms]
  page: [html, llms, markdown]
  section: [html, llms, markdown]
